# Local development stack:
#   docker compose up   → PostgreSQL, Silo S3 (+ bucket, profile local-s3), Go API, web (Vite dev server)
# Open http://localhost:5173. The web container proxies /api to the API, so auth cookies are first-party.
name: openaudio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openaudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openaudio}
      POSTGRES_DB: ${POSTGRES_DB:-openaudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openaudio} -d ${POSTGRES_DB:-openaudio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible storage: PGSTY Silo (maintained MinIO fork). Started only with the
  # "local-s3" profile (COMPOSE_PROFILES=local-s3, the .env.example default); leave the profile
  # out and set S3_* in .env to use external S3 (AWS, R2, B2, Wasabi, your own MinIO/Silo...).
  silo:
    image: ${SILO_IMAGE:-pgsty/silo:RELEASE.2026-11-12T00-00-00Z}
    profiles: [local-s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-openaudio}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-openaudio-secret}
    ports:
      - "${SILO_API_PORT:-9000}:9000"
      - "${SILO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - silodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket (private) with the client bundled in the Silo image.
  silo-init:
    image: ${SILO_IMAGE:-pgsty/silo:RELEASE.2026-11-12T00-00-00Z}
    profiles: [local-s3]
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://silo:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mcli mb --ignore-existing local/$${BUCKET} &&
      mcli anonymous set none local/$${BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-openaudio}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-openaudio-secret}
      BUCKET: ${S3_BUCKET:-openaudio-dev}

  api:
    build:
      context: ./api
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      # Empty WEB_URL / PUBLIC_URL derive from BASE_DOMAIN (or fall back to http://localhost:5173).
      # Browsers reach the API through the Vite proxy on the web origin.
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      BASE_SCHEME: ${BASE_SCHEME:-}
      WEB_URL: ${WEB_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      AUTH_REDIRECT_PATH: ${AUTH_REDIRECT_PATH:-/}
      AUTH_CALLBACK_URL: ${AUTH_CALLBACK_URL:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-openaudio}:${POSTGRES_PASSWORD:-openaudio}@postgres:5432/${POSTGRES_DB:-openaudio}?sslmode=disable
      # Object storage: local Silo unless S3_ENDPOINT points elsewhere (see .env.example).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://silo:9000}
      # Presigned download URLs must point at an address the browser can reach:
      # external S3 -> the same endpoint (or a CDN); local Silo -> its published port.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT:-http://localhost:9000}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${SILO_ROOT_USER:-openaudio}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${SILO_ROOT_PASSWORD:-openaudio-secret}}
      S3_BUCKET: ${S3_BUCKET:-openaudio-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_PART_SIZE: ${UPLOAD_PART_SIZE:-8388608}
      MAX_BLOB_SIZE: ${MAX_BLOB_SIZE:-2147483648}
      DOWNLOAD_URL_TTL: ${DOWNLOAD_URL_TTL:-10m}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Only when the local-s3 profile is active; with external S3 the API starts without it.
      silo-init:
        condition: service_completed_successfully
        required: false

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY: http://api:8080
      VITE_API_MODE: http
      VITE_AUTH_REDIRECT_PATH: ${AUTH_REDIRECT_PATH:-/}
      # Lets the dev server answer on the deployment's host name.
      BASE_DOMAIN: ${BASE_DOMAIN:-}
    depends_on:
      - api

volumes:
  pgdata:
  silodata:
