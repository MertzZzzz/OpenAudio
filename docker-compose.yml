# Local development stack:
#   docker compose up   → PostgreSQL, MinIO (+ bucket), Go API, web (Vite dev server)
# Open http://localhost:5173. The web container proxies /api to the API, so auth cookies are first-party.
name: openaudio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openaudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openaudio}
      POSTGRES_DB: ${POSTGRES_DB:-openaudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openaudio} -d ${POSTGRES_DB:-openaudio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest # TODO: pin a RELEASE tag
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openaudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openaudio-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest # TODO: pin together with minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set none local/$${MINIO_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openaudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openaudio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-openaudio-dev}

  api:
    build:
      context: ./api
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      # Browsers reach the API through the Vite proxy on the web origin.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-openaudio}:${POSTGRES_PASSWORD:-openaudio}@postgres:5432/${POSTGRES_DB:-openaudio}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-openaudio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-openaudio-secret}
      S3_BUCKET: ${MINIO_BUCKET:-openaudio-dev}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-OpenAudio <no-reply@openaudio.local>}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY: http://api:8080
      VITE_AUTH_MODE: http
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
