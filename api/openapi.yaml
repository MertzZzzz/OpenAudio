openapi: 3.1.0
info:
  title: OpenAudio API
  version: 1.0.0
  summary: Catalog, publishing and versioning of open audio packages.
  description: |
    API-first contract for the OpenAudio MVP. The web app's mock layer
    (`web/src/shared/api`) implements the same shapes; TypeScript types will be
    generated from this file once the backend lands (Phase 2).

    Conventions:
    - All errors use the `Error` schema.
    - Releases are immutable once published; fixes ship as new versions.
    - Blobs are content-addressed: `blobs/{sha256}`; downloads use short-lived presigned URLs.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:5173/api/v1
    description: Local, through the web dev-server proxy (docker compose up)
  - url: http://localhost:8080/api/v1
    description: Local, API directly
tags:
  - name: system
    description: Health and readiness probes
  - name: auth
    description: Email/password, Google and Discord sign-in; sessions; email verification; password reset
  - name: admin
    description: Platform administration
  - name: publishers
    description: Publishers and their members (owner / maintainer / uploader)
  - name: packages
    description: Packages and manifests
  - name: releases
    description: Draft → publish (immutable) → yank
  - name: uploads
    description: Resumable content-addressed blob uploads
  - name: search
    description: Full-text and faceted search over packages and samples; controlled vocabulary
  - name: library
    description: Personal libraries, pinned versions, dependency resolution and lockfiles
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness
      security: []
      operationId: health
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /health/ready:
    get:
      tags: [system]
      summary: Readiness (database, object storage)
      security: []
      operationId: ready
      responses:
        '200': { $ref: '#/components/responses/Readiness' }
        '503': { $ref: '#/components/responses/Readiness' }

  # ------------------------------------------------------------------ auth
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account with email and password
      description: Sends a verification email. Rate limited per client IP.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
                displayName: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and issue a new access token
      description: |
        The refresh token is read from the JSON body or, if absent, from the `oa_refresh` cookie.
        Refresh tokens are single-use; presenting an already rotated token revokes the whole session family.
      operationId: refresh
      security: []
      parameters:
        - { name: oa_refresh, in: cookie, required: false, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session (refresh token family) and clear the cookie
      operationId: logout
      security: []
      parameters:
        - { name: oa_refresh, in: cookie, required: false, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Signed out }
        '422': { $ref: '#/components/responses/Error' }
  /auth/email/verify:
    post:
      tags: [auth]
      summary: Confirm an email address with the token from the verification email
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Verified }
        '401': { $ref: '#/components/responses/Error' }
  /auth/email/resend:
    post:
      tags: [auth]
      summary: Send a new verification email (invalidates older links)
      operationId: resendVerification
      responses:
        '202': { description: Sent }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Request a password reset email
      description: Always returns 202 so it cannot be used to discover registered emails.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token; signs out all sessions
      description: Also lets Google/Discord-only accounts add a password.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/providers:
    get:
      tags: [auth]
      summary: Enabled sign-in methods
      operationId: listAuthProviders
      security: []
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                required: [email, oauth]
                properties:
                  email: { type: boolean }
                  oauth:
                    type: array
                    items:
                      type: object
                      required: [id, startUrl]
                      properties:
                        id: { $ref: '#/components/schemas/AuthProvider' }
                        startUrl: { type: string, examples: [/api/v1/auth/oauth/google/start] }
  /auth/oauth/{provider}/start:
    parameters:
      - $ref: '#/components/parameters/AuthProvider'
    get:
      tags: [auth]
      summary: Begin sign-in with Google or Discord (browser navigation)
      description: |
        Sets a short-lived signed `oa_oauth` cookie (state, PKCE verifier, return path) and redirects to the provider.
        `returnTo` must be a relative path; anything else falls back to `/`.
      operationId: oauthStart
      security: []
      parameters:
        - { name: returnTo, in: query, schema: { type: string, examples: [/library] } }
      responses:
        '302': { description: Redirect to the provider consent screen }
        '404': { $ref: '#/components/responses/Error' }
  /auth/oauth/{provider}/callback:
    parameters:
      - $ref: '#/components/parameters/AuthProvider'
    get:
      tags: [auth]
      summary: Provider redirect target
      description: |
        Verifies state, exchanges the code, signs the user in (linking a verified email to an existing account),
        sets the `oa_refresh` cookie and redirects to `{WEB_URL}/auth/callback?returnTo=…`.
        On failure redirects to `{WEB_URL}/auth/callback?error=<code>` (e.g. `oauth_denied`, `oauth_state_mismatch`,
        `oauth_email_missing`, `email_unverified_at_provider`). The SPA completes sign-in with `POST /auth/refresh`.
      operationId: oauthCallback
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: Redirect back to the web app }
  /me:
    get:
      tags: [auth]
      summary: Current user with linked identities
      operationId: me
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }

  # ----------------------------------------------------------------- admin
  /admin/users/{id}/role:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [admin]
      summary: Change a user's platform role (admin only)
      operationId: setUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- manifests
  /schemas/openaudio.package/v1:
    get:
      tags: [packages]
      summary: JSON Schema of the package manifest (draft 2020-12)
      operationId: getManifestSchema
      security: []
      responses:
        '200':
          description: JSON Schema
          content:
            application/schema+json:
              schema: { type: object }
  /manifests/validate:
    post:
      tags: [packages]
      summary: Validate a manifest without storing it (JSON Schema + domain rules + recommendations)
      description: With `publisher` and `package` the manifest is first normalized against that package, as a draft would be.
      operationId: validateManifest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest]
              properties:
                manifest: { $ref: '#/components/schemas/Manifest' }
                publisher: { type: string }
                package: { type: string }
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid: { type: boolean }
                  issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }

  # ------------------------------------------------------------- publishers
  /publishers:
    post:
      tags: [publishers]
      summary: Create a publisher (caller becomes owner; requires a verified email)
      description: A caller with platform role `user` is promoted to `publisher`; refresh the session to get the new role in the access token.
      operationId: createPublisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', minLength: 2, maxLength: 40 }
                name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publisher' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /me/publishers:
    get:
      tags: [publishers]
      summary: Publishers the caller is a member of (with role)
      operationId: myPublishers
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Publisher' } }
        '401': { $ref: '#/components/responses/Error' }
  /publishers/{publisher}:
    parameters:
      - $ref: '#/components/parameters/Publisher'
    get:
      tags: [publishers]
      summary: Publisher profile
      operationId: getPublisher
      security: []
      responses:
        '200':
          description: Publisher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publisher' }
        '404': { $ref: '#/components/responses/Error' }
  /publishers/{publisher}/packages:
    parameters:
      - $ref: '#/components/parameters/Publisher'
    get:
      tags: [publishers]
      summary: Dashboard listing — every package (published or not) with all releases, including drafts (members only)
      operationId: publisherPackages
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Package'
                    - type: object
                      properties:
                        releases: { type: array, items: { $ref: '#/components/schemas/Release' } }
        '403': { $ref: '#/components/responses/Error' }
  /publishers/{publisher}/members:
    parameters:
      - $ref: '#/components/parameters/Publisher'
    get:
      tags: [publishers]
      summary: Members (visible to members)
      operationId: listMembers
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [publishers]
      summary: Add an existing user as maintainer or uploader (owner only)
      operationId: addMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [maintainer, uploader] }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /publishers/{publisher}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [publishers]
      summary: Remove a member (owner), or leave (self). The owner cannot be removed.
      operationId: removeMember
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- packages
  /packages:
    get:
      tags: [packages]
      summary: List published public packages
      description: Basic listing (text, kind, publisher). Taxonomy/BPM/key facets come with `/search` (Phase 5).
      operationId: listPackages
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/PackageKind' } } }
        - { name: publisher, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, name, created], default: newest } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of packages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackagePage' }
    post:
      tags: [packages]
      summary: Create a package (owner / maintainer)
      operationId: createPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publisher, slug, name, kind]
              properties:
                publisher: { type: string }
                slug: { $ref: '#/components/schemas/Slug' }
                name: { type: string, minLength: 2, maxLength: 80 }
                kind: { $ref: '#/components/schemas/PackageKind' }
                description: { type: string, maxLength: 2000 }
                visibility: { type: string, enum: [public, unlisted, private], default: public }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /packages/{publisher}/{slug}:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [packages]
      summary: Package details (metadata from the latest published manifest)
      operationId: getPackage
      security: []
      responses:
        '200':
          description: Package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [packages]
      summary: Update mutable package fields (name, description, visibility)
      operationId: updatePackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [public, unlisted, private] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '403': { $ref: '#/components/responses/Error' }
  /packages/{publisher}/{slug}/versions:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [packages]
      summary: All releases, newest version first (drafts only for members)
      operationId: listVersions
      security: []
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Release' } }
  /packages/{publisher}/{slug}/versions/{version}/manifest:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [packages]
      summary: Canonical manifest bytes of a release
      description: The body hashes to `X-Content-Digest`, which is also the strong ETag.
      operationId: getManifest
      security: []
      responses:
        '200':
          description: Manifest
          headers:
            X-Content-Digest: { schema: { $ref: '#/components/schemas/Digest' } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- releases
  /packages/{publisher}/{slug}/releases:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [releases]
      summary: Create a draft release from a manifest (any member)
      description: |
        The server fills `schema`, `id` (`<publisher>.<package>`), `publisher`, `kind` and `name`, rejects conflicting values,
        validates the manifest and stores it canonically with its sha256 digest. Warnings are returned but do not block.
      operationId: createRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest]
              properties:
                version: { $ref: '#/components/schemas/SemVer' }
                changelog: { type: string, maxLength: 5000 }
                manifest: { $ref: '#/components/schemas/Manifest' }
      responses:
        '201': { $ref: '#/components/responses/Draft' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /packages/{publisher}/{slug}/releases/{version}:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [releases]
      summary: Release with artifacts (presigned download URLs for published releases)
      operationId: getRelease
      security: []
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseDetails' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [releases]
      summary: Replace the manifest and/or changelog of a draft
      operationId: updateRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                changelog: { type: string }
                manifest: { $ref: '#/components/schemas/Manifest' }
      responses:
        '200': { $ref: '#/components/responses/Draft' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [releases]
      summary: Delete a draft
      operationId: deleteRelease
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /packages/{publisher}/{slug}/releases/{version}/publish:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [releases]
      summary: Publish a draft (owner / maintainer; irreversible)
      description: |
        Re-validates the manifest and checks that every artifact exists at `blobs/{sha256}` with the declared size
        (`422 release_incomplete` lists the missing ones). Stores the manifest at
        `manifests/{packageId}/{version}/manifest.json`, records artifacts and taxonomy, recomputes `latestVersion`.
      operationId: publishRelease
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /packages/{publisher}/{slug}/releases/{version}/yank:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [releases]
      summary: Yank a published release (stays downloadable for existing lockfiles, never chosen for new installs)
      operationId: yankRelease
      responses:
        '200':
          description: Yanked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # --------------------------------------------------------------- uploads
  /uploads:
    post:
      tags: [uploads]
      summary: Start a resumable upload of one content-addressed blob
      description: |
        Returns `200` with `status: done` when a blob with this digest already exists (nothing to upload),
        otherwise `201` with `partSize` / `partCount`. Requires membership in a publisher (or role publisher/admin).
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digest, size]
              properties:
                digest: { $ref: '#/components/schemas/Digest' }
                size: { type: integer, minimum: 1 }
                contentType: { type: string, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Upload' }
        '201': { $ref: '#/components/responses/Upload' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    get:
      tags: [uploads]
      summary: Upload status with received parts (for resuming)
      operationId: getUpload
      responses:
        '200': { $ref: '#/components/responses/Upload' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [uploads]
      summary: Abort a pending upload
      operationId: abortUpload
      responses:
        '204': { description: Aborted }
        '409': { $ref: '#/components/responses/Error' }
  /uploads/{uploadId}/parts/{partNumber}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
      - { name: partNumber, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 10000 } }
    put:
      tags: [uploads]
      summary: Upload one part; Content-Length must equal the exact part size. Parts may arrive in any order and be retried.
      operationId: uploadPart
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: Part stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadPart' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /uploads/{uploadId}/complete:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      tags: [uploads]
      summary: Assemble parts, verify SHA-256 and size on the server, store at blobs/{sha256}
      description: '`422 digest_mismatch` when the uploaded bytes do not hash to the declared digest (nothing is stored).'
      operationId: completeUpload
      responses:
        '200': { $ref: '#/components/responses/Upload' }
        '422': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- search
  /search:
    get:
      tags: [search]
      summary: Search packages (full text + taxonomy + musical metadata)
      description: |
        Full-text search over name, publisher, tags, taxonomy (slugs and labels) and description with prefix matching.
        Words that name a vocabulary term or alias (e.g. `dnb`) also match packages tagged with it.
        Genre / instrument / mood / use-case / category filters include sub-terms (`house` matches `deep-house`).
        BPM filters match packages whose BPM (or BPM range) overlaps the requested range.
        Only public packages with a published release are indexed (their latest release).
      operationId: search
      security: []
      parameters:
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchKind'
        - $ref: '#/components/parameters/ListGenre'
        - $ref: '#/components/parameters/ListInstrument'
        - $ref: '#/components/parameters/ListMood'
        - $ref: '#/components/parameters/ListUseCase'
        - $ref: '#/components/parameters/ListCategory'
        - $ref: '#/components/parameters/ListModuleClass'
        - $ref: '#/components/parameters/ListKey'
        - $ref: '#/components/parameters/ListLicense'
        - { name: publisher, in: query, schema: { type: string } }
        - { name: commercial, in: query, schema: { type: boolean } }
        - { name: bpmMin, in: query, schema: { type: integer, minimum: 20, maximum: 400 } }
        - { name: bpmMax, in: query, schema: { type: integer, minimum: 20, maximum: 400 } }
        - { name: energyMin, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: energyMax, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: sort, in: query, description: 'Default: relevance with q, newest otherwise. `rating` falls back to downloads.', schema: { type: string, enum: [relevance, newest, downloads, name, rating] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PackagePage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Package'
                            - type: object
                              properties:
                                score: { type: number, description: Relevance (0 without q) }
        '422': { $ref: '#/components/responses/Error' }
  /search/facets:
    get:
      tags: [search]
      summary: Facet counts for a search; each facet ignores its own selection
      operationId: searchFacets
      security: []
      parameters:
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchKind'
        - $ref: '#/components/parameters/ListGenre'
        - $ref: '#/components/parameters/ListInstrument'
        - $ref: '#/components/parameters/ListMood'
        - $ref: '#/components/parameters/ListUseCase'
        - $ref: '#/components/parameters/ListCategory'
        - $ref: '#/components/parameters/ListModuleClass'
        - $ref: '#/components/parameters/ListKey'
        - $ref: '#/components/parameters/ListLicense'
        - { name: bpmMin, in: query, schema: { type: integer } }
        - { name: bpmMax, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Facets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchFacets' }
        '422': { $ref: '#/components/responses/Error' }
  /search/samples:
    get:
      tags: [search]
      summary: Search individual samples of the latest releases (metadata inherits package defaults)
      operationId: searchSamples
      security: []
      parameters:
        - { name: q, in: query, description: 'Name, path, package name, instrument or tag', schema: { type: string } }
        - { name: package, in: query, description: 'Package id, e.g. acme.deep-house-toolkit', schema: { type: string } }
        - $ref: '#/components/parameters/ListInstrument'
        - { name: contentType, in: query, schema: { type: string, enum: [loop, one-shot] } }
        - $ref: '#/components/parameters/ListKey'
        - { name: bpmMin, in: query, schema: { type: integer } }
        - { name: bpmMax, in: query, schema: { type: integer } }
        - { name: durationMax, in: query, description: Seconds, schema: { type: number } }
        - $ref: '#/components/parameters/Page'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Samples
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Sample' } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /taxonomy:
    get:
      tags: [search]
      summary: Controlled vocabulary (genres, instruments, moods, use cases, module categories)
      operationId: getTaxonomy
      security: []
      responses:
        '200':
          description: Vocabulary
          content:
            application/json:
              schema:
                type: object
                required: [taxonomyVersion, terms]
                properties:
                  taxonomyVersion: { type: string, examples: ['2026.11'] }
                  terms:
                    type: array
                    items:
                      type: object
                      required: [domain, slug, label, aliases]
                      properties:
                        domain: { type: string, enum: [genre, instrument, mood, use-case, module-category] }
                        slug: { type: string }
                        label: { type: string }
                        parent: { type: string }
                        aliases: { type: array, items: { type: string } }
  /packages/{publisher}/{slug}/preview:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [packages]
      summary: Playable audio for the package (redirect)
      description: Redirects to a `preview` artifact of the latest release, or its first sample. Not counted as a download.
      operationId: packagePreview
      security: []
      responses:
        '302': { description: Redirect to a short-lived presigned URL }
        '404': { $ref: '#/components/responses/Error' }
  /packages/{publisher}/{slug}/releases/{version}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/Publisher'
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Version'
      - { name: path, in: path, required: true, description: 'Artifact path; may contain slashes', schema: { type: string } }
    get:
      tags: [releases]
      summary: Download one artifact (counts a download, redirects to a presigned URL)
      description: With `preview=1` the file is served inline for playback and not counted.
      operationId: downloadFile
      security: []
      parameters:
        - { name: preview, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '302': { description: Redirect to a short-lived presigned URL }
        '404': { $ref: '#/components/responses/Error' }

  # --------------------------------------------------------------- library
  /libraries:
    get:
      tags: [library]
      summary: The caller's libraries (a default "My Library" is created on first use)
      operationId: listLibraries
      responses:
        '200':
          description: Libraries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Library' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [library]
      summary: Create a library
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '409': { $ref: '#/components/responses/Error' }
  /libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    patch:
      tags: [library]
      summary: Rename a library
      operationId: renameLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [library]
      summary: Delete a library (saved lockfiles are kept)
      operationId: deleteLibrary
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /libraries/{libraryId}/items:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [library]
      summary: Packages in a library
      operationId: listLibraryItems
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LibraryItem' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [library]
      summary: Add a package (optionally pinned to a published version); adding again updates the pin
      operationId: addLibraryItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packageId]
              properties:
                packageId: { type: string, examples: [acme.deep-house-toolkit] }
                pinnedVersion: { $ref: '#/components/schemas/SemVer' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /libraries/{libraryId}/items/{packageId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - { name: packageId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [library]
      summary: 'Pin (`pinnedVersion: "1.2.0"`), unpin (`pinnedVersion: null`) or upgrade an unpinned item to the latest version (`upgrade: true`)'
      operationId: updateLibraryItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pinnedVersion: { type: [string, 'null'] }
                upgrade: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [library]
      summary: Remove a package from the library
      operationId: removeLibraryItem
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
  /libraries/{libraryId}/resolve:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    post:
      tags: [library]
      summary: Resolve versions and dependencies (nothing is stored)
      description: |
        Pinned items keep their exact version (even a yanked one, with a warning); unpinned items keep their
        installed version while it satisfies every range, otherwise the newest published satisfying version is chosen.
        Dependencies come from the manifest of the chosen version.
      operationId: resolveLibrary
      responses:
        '200':
          description: Lockfile, conflicts and warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveResult' }
  /libraries/{libraryId}/lockfiles:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    post:
      tags: [library]
      summary: Resolve and save a lockfile (409 resolve_conflicts when the library has conflicts)
      operationId: saveLockfile
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedLockfile' }
        '409': { $ref: '#/components/responses/Error' }
  /libraries/{libraryId}/import:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    post:
      tags: [library]
      summary: Pin the library to a lockfile's versions
      description: |
        Every entry is verified against the registry (package and version exist, manifest digest matches); any
        mismatch rejects the whole import with `422 lockfile_invalid`. Entries with `direct: false` are verified but
        not pinned (they are resolved as dependencies).
      operationId: importLockfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lockfile]
              properties:
                lockfile: { $ref: '#/components/schemas/Lockfile' }
      responses:
        '200':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                required: [pinned, warnings]
                properties:
                  pinned: { type: integer }
                  warnings: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /lockfiles:
    get:
      tags: [library]
      summary: Saved lockfiles (newest first, without content)
      operationId: listLockfiles
      responses:
        '200':
          description: Lockfiles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SavedLockfile' } }
  /lockfiles/{lockfileId}:
    parameters:
      - { name: lockfileId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [library]
      summary: Download a saved lockfile (exact canonical bytes; X-Content-Digest is their sha256)
      operationId: getLockfile
      responses:
        '200':
          description: openaudio.lock.json
          headers:
            X-Content-Digest: { schema: { $ref: '#/components/schemas/Digest' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lockfile' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [library]
      summary: Delete a saved lockfile
      operationId: deleteLockfile
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Publisher: { name: publisher, in: path, required: true, schema: { type: string } }
    AuthProvider: { name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/AuthProvider' } }
    Slug: { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
    Version: { name: version, in: path, required: true, schema: { $ref: '#/components/schemas/SemVer' } }
    UploadId: { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    LibraryId: { name: libraryId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
    ListGenre: { name: genre, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
    ListInstrument: { name: instrument, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
    ListMood: { name: mood, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
    ListUseCase: { name: useCase, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
    ListCategory: { name: category, in: query, description: Module categories, schema: { type: array, items: { type: string } }, style: form, explode: false }
    ListModuleClass: { name: moduleClass, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ModuleClass' } }, style: form, explode: false }
    ListKey: { name: key, in: query, description: 'e.g. F-minor, C#-major', schema: { type: array, items: { type: string, pattern: '^(C|C#|D|D#|E|F|F#|G|G#|A|A#|B)-(major|minor)$' } }, style: form, explode: false }
    ListLicense: { name: license, in: query, description: SPDX identifiers, schema: { type: array, items: { type: string } }, style: form, explode: false }
    SearchQ: { name: q, in: query, schema: { type: string, maxLength: 200 } }
    SearchKind: { name: kind, in: query, schema: { type: array, items: { $ref: '#/components/schemas/PackageKind' } }, style: form, explode: false }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Manifest or request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Session:
      description: |
        Access + refresh tokens. The refresh token is also set as the `oa_refresh` cookie
        (HttpOnly, SameSite=Lax, Path=/api/v1/auth); browsers should rely on the cookie.
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, tokenType, refreshToken, expiresIn, user]
            properties:
              accessToken: { type: string, description: 'JWT (HS256); send as Authorization: Bearer <token>' }
              tokenType: { const: Bearer }
              refreshToken: { type: string }
              expiresIn: { type: integer, description: Access token lifetime in seconds }
              user: { $ref: '#/components/schemas/User' }
    Draft:
      description: Stored draft and non-blocking warnings
      content:
        application/json:
          schema:
            type: object
            required: [release, warnings]
            properties:
              release: { $ref: '#/components/schemas/Release' }
              warnings: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    Upload:
      description: Upload session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Upload' }
    Readiness:
      description: Dependency status
      content:
        application/json:
          schema:
            type: object
            required: [status, checks]
            properties:
              status: { type: string, enum: [ok, degraded] }
              checks:
                type: object
                additionalProperties: { type: string }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [package_not_found, release_immutable, validation_failed] }
        message: { type: string }
        requestId: { type: string }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
    ValidationIssue:
      type: object
      required: [severity, path, message]
      properties:
        severity: { type: string, enum: [error, warning, info] }
        path: { type: string }
        message: { type: string }

    Slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 64 }
    SemVer: { type: string, pattern: '^\d+\.\d+\.\d+$' }
    Digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }

    Role: { type: string, enum: [user, publisher, admin] }
    AuthProvider: { type: string, enum: [google, discord] }
    User:
      type: object
      required: [id, email, displayName, role, emailVerified, hasPassword, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        avatarUrl: { type: [string, 'null'], format: uri }
        emailVerified: { type: boolean }
        hasPassword: { type: boolean, description: false for accounts created via Google/Discord only }
        identities:
          type: array
          description: Linked external accounts (only on GET /me)
          items:
            type: object
            required: [provider, linkedAt]
            properties:
              provider: { $ref: '#/components/schemas/AuthProvider' }
              email: { type: string }
              linkedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PackageKind:
      type: string
      enum: [sample-pack, preset-pack, instrument, effect, midi-tool, utility, project-template, model]
    ModuleClass:
      type: string
      enum: [instrument, audio-effect, note-effect, note-generator, audio-generator, analyzer, utility, converter, macro, visualizer]
    Signal:
      type: string
      enum: [audio, midi, transport, automation, sidechain, analysis]

    Publisher:
      type: object
      required: [id, slug, name, verified]
      properties:
        id: { type: string, description: 'Publisher id used in manifests (= slug)', examples: [acme] }
        slug: { type: string }
        name: { type: string }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }
        role: { type: string, enum: [owner, maintainer, uploader], description: Caller's role (membership listings only) }
    Member:
      type: object
      required: [userId, name, email, role]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, maintainer, uploader] }
    License:
      type: object
      required: [content, commercialUse, attributionRequired]
      properties:
        content: { type: string, description: SPDX identifier }
        commercialUse: { type: boolean }
        attributionRequired: { type: boolean }
    MusicalKey:
      type: object
      required: [tonic, mode]
      properties:
        tonic: { type: string, enum: [C, 'C#', D, 'D#', E, F, 'F#', G, 'G#', A, 'A#', B] }
        mode: { type: string, enum: [major, minor] }
        camelot: { type: string }
    Taxonomy:
      type: object
      required: [genres, instruments, moods]
      properties:
        genres:
          type: object
          required: [primary]
          properties:
            primary: { type: string }
            secondary: { type: array, items: { type: string }, maxItems: 3 }
        instruments: { type: array, items: { type: string } }
        moods: { type: array, items: { type: string }, maxItems: 3 }
        useCases: { type: array, items: { type: string } }
        energy: { type: number, minimum: 0, maximum: 1 }
    Musical:
      type: object
      properties:
        bpm:
          type: object
          required: [value]
          properties:
            value: { type: integer, minimum: 20, maximum: 400 }
            range: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
            sync: { type: boolean }
        key: { $ref: '#/components/schemas/MusicalKey' }
        timeSignature: { type: string, pattern: '^\d+/\d+$' }
    Technical:
      type: object
      properties:
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        formats: { type: array, items: { type: string } }
    Module:
      type: object
      required: [moduleClass, capabilities, categories]
      properties:
        moduleClass: { $ref: '#/components/schemas/ModuleClass' }
        capabilities:
          type: object
          required: [accepts, produces, placement]
          properties:
            accepts: { type: array, items: { $ref: '#/components/schemas/Signal' } }
            produces: { type: array, items: { $ref: '#/components/schemas/Signal' } }
            placement: { type: array, items: { type: string } }
            bypassable: { type: boolean }
            wetDry: { type: boolean }
            stateful: { type: boolean }
        ports:
          type: array
          items:
            type: object
            required: [id, direction, signal]
            properties:
              id: { type: string }
              direction: { type: string, enum: [in, out] }
              signal: { $ref: '#/components/schemas/Signal' }
              channels: { type: integer }
        categories: { type: array, items: { type: string } }

    Package:
      type: object
      description: Package row plus metadata of its latest published manifest (null / empty before the first release).
      required: [id, publisher, slug, name, kind, description, visibility, latestVersion, createdAt, updatedAt, stats, tags]
      properties:
        id: { type: string, description: '"<publisher>.<package>" — used in manifests and dependencies', examples: [acme.deep-house-toolkit] }
        publisher: { $ref: '#/components/schemas/Publisher' }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/PackageKind' }
        description: { type: string }
        visibility: { type: string, enum: [public, unlisted, private] }
        latestVersion: { type: [string, 'null'], description: Highest published (not yanked) version }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stats:
          type: object
          properties:
            artifacts: { type: integer }
            samples: { type: integer }
            sizeBytes: { type: integer }
        license: { oneOf: [{ $ref: '#/components/schemas/License' }, { type: 'null' }] }
        taxonomy: { oneOf: [{ $ref: '#/components/schemas/Taxonomy' }, { type: 'null' }] }
        musical: { oneOf: [{ $ref: '#/components/schemas/Musical' }, { type: 'null' }] }
        technical: { oneOf: [{ $ref: '#/components/schemas/Technical' }, { type: 'null' }] }
        module: { oneOf: [{ $ref: '#/components/schemas/Module' }, { type: 'null' }] }
        dependencies:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              range: { type: string, examples: ['^1.0.0'] }
        tags: { type: array, items: { type: string } }
        downloads: { type: integer }
    PackagePage:
      type: object
      required: [items, total, page, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Package' } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    Release:
      type: object
      required: [version, status, manifestDigest, changelog, createdAt]
      properties:
        version: { $ref: '#/components/schemas/SemVer' }
        status: { type: string, enum: [draft, published, yanked] }
        publishedAt: { type: [string, 'null'], format: date-time }
        changelog: { type: string }
        manifestDigest: { $ref: '#/components/schemas/Digest' }
        createdAt: { type: string, format: date-time }
    ReleaseDetails:
      allOf:
        - $ref: '#/components/schemas/Release'
        - type: object
          required: [package, artifacts]
          properties:
            package: { type: string }
            artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
    Artifact:
      type: object
      required: [kind, path, digest, size]
      properties:
        kind: { type: string, enum: [manifest, sample, preview, binary, index] }
        path: { type: string }
        digest: { $ref: '#/components/schemas/Digest' }
        size: { type: integer }
        contentType: { type: string }
        downloadUrl: { type: string, format: uri, description: Short-lived presigned URL (published releases only) }
    Manifest:
      type: object
      description: |
        `openaudio.package/v1` manifest. The authoritative JSON Schema is served at
        `GET /schemas/openaudio.package/v1` (api/internal/manifest/openaudio.package.v1.json).
      additionalProperties: true
    Upload:
      type: object
      required: [id, digest, size, status, partSize, partCount, parts, createdAt]
      properties:
        id: { type: string, format: uuid }
        digest: { $ref: '#/components/schemas/Digest' }
        size: { type: integer }
        contentType: { type: string }
        status: { type: string, enum: [pending, done, failed] }
        partSize: { type: integer, description: Every part except the last has exactly this size }
        partCount: { type: integer, description: 0 when the blob is already stored }
        parts: { type: array, items: { $ref: '#/components/schemas/UploadPart' } }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    UploadPart:
      type: object
      required: [number, size]
      properties:
        number: { type: integer }
        size: { type: integer }
    FacetBucket:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }
    SearchFacets:
      type: object
      description: Buckets sorted by count. `bpm` values are ranges like `120-129`.
      properties:
        kind: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        genre: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        instrument: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        mood: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        useCase: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        category: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        moduleClass: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        key: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        license: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        bpm: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
    Sample:
      type: object
      required: [id, packageId, packageName, version, name, file, digest, size, contentType, moods, tags, downloadUrl]
      properties:
        id: { type: string, examples: [acme.deep-house-toolkit/loops/bass.wav] }
        packageId: { type: string }
        packageName: { type: string }
        version: { $ref: '#/components/schemas/SemVer' }
        name: { type: string }
        file: { type: string }
        digest: { $ref: '#/components/schemas/Digest' }
        size: { type: integer }
        contentType: { type: string, enum: [loop, one-shot] }
        instrument: { type: string }
        role: { type: string }
        bpm: { type: [integer, 'null'] }
        key: { oneOf: [{ $ref: '#/components/schemas/MusicalKey' }, { type: 'null' }] }
        durationSec: { type: [number, 'null'] }
        moods: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        downloadUrl: { type: string, description: API path that counts the download and redirects to a presigned URL }
    LibraryItem:
      type: object
      required: [packageId, package, pinnedVersion, installedVersion, addedAt]
      properties:
        packageId: { type: string }
        package: { $ref: '#/components/schemas/Package' }
        pinnedVersion: { type: [string, 'null'] }
        installedVersion: { type: [string, 'null'] }
        addedAt: { type: string, format: date-time }
    Library:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    Lockfile:
      type: object
      required: [lockfileVersion, name, generatedAt, packages]
      properties:
        lockfileVersion: { const: 1 }
        name: { type: string }
        generatedAt: { type: string, format: date-time }
        packages:
          type: object
          additionalProperties:
            type: object
            required: [id, version, manifestDigest, resolved, direct]
            properties:
              id: { type: string }
              version: { $ref: '#/components/schemas/SemVer' }
              manifestDigest: { $ref: '#/components/schemas/Digest' }
              resolved: { type: string, examples: ['openaudio://acme/deep-house-toolkit@1.2.0'] }
              direct: { type: boolean, description: In the library itself (false = pulled in as a dependency) }
              yanked: { type: boolean }
              dependencies: { type: object, additionalProperties: { type: string } }
    SavedLockfile:
      type: object
      required: [id, name, contentDigest, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        libraryId: { type: [string, 'null'], format: uuid }
        contentDigest: { $ref: '#/components/schemas/Digest' }
        createdAt: { type: string, format: date-time }
        lockfile: { $ref: '#/components/schemas/Lockfile' }
    ResolveResult:
      type: object
      required: [lockfile, conflicts, warnings]
      properties:
        lockfile: { $ref: '#/components/schemas/Lockfile' }
        conflicts:
          type: array
          items:
            type: object
            required: [packageId, reason, requestedBy, candidates]
            properties:
              packageId: { type: string }
              reason: { type: string, enum: [no_matching_version, package_not_found] }
              requestedBy:
                type: array
                items:
                  type: object
                  properties:
                    packageId: { type: string, description: 'Requesting package, or "library" for the library pin' }
                    range: { type: string }
              candidates: { type: array, items: { type: string } }
        warnings: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
